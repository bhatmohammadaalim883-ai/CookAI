
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CookAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 70px auto;
            padding: 30px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }
        .auth-container h1 { text-align: center; margin-bottom: 10px; }
        .auth-container p { text-align: center; color: #666; }
        .auth-container input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .auth-container button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #269b59;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .auth-container button:hover { background: #1d7c47; }
        .auth-link { margin-top: 20px; }
        .auth-message { text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

<div class="auth-container">
    <h1>Create Account</h1>
    <p>Join CookAI and discover delicious recipes.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="auth-message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('signup') }}">
        <input type="text" name="username"
               placeholder="Username" maxlength="50" required>

        <input type="email" name="email"
               placeholder="Email address" maxlength="120" required>

        <input type="password" name="password"
               placeholder="Password (minimum 8 characters)"
               minlength="8" required>

        <button type="submit">Create Account</button>
    </form>

    <p class="auth-link">
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </p>

    <p><a href="{{ url_for('home') }}">Back to CookAI</a></p>
</div>

</body>
</html>
