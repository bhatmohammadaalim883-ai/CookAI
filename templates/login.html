
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CookAI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .auth-container {
            max-width: 420px;
            margin: 70px auto;
            padding: 30px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .auth-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-container p {
            text-align: center;
            color: #666;
        }

        .auth-container input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .auth-container button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #269b59;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .auth-container button:hover {
            background: #1d7c47;
        }

        .auth-message {
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>

<body>

<div class="auth-container">

    <h1>Welcome Back!</h1>
    <p>Login to your CookAI account.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="auth-message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">

        <input
            type="email"
            name="email"
            placeholder="Email address"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have an account?
        <a href="{{ url_for('signup') }}">Create Account</a>
    </p>

    <p>
        <a href="{{ url_for('home') }}">Back to CookAI</a>
    </p>

</div>

</body>
</html>
